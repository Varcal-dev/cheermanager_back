# Produccion sencilla en un VPS: MySQL + API. El frontend se publica aparte (Vercel u otro).
# Uso:  cp .env.example .env  (editar valores)  &&  docker compose up -d --build
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?define DB_ROOT_PASSWORD}
      MYSQL_DATABASE: cheermanager
      MYSQL_USER: ${DB_USERNAME:?define DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
      TZ: America/Bogota
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No se publica el puerto 3306: solo la API lo alcanza por la red interna.
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"   # sin esto los logs de Docker crecen hasta llenar el disco
        max-file: "5"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Bogota
      DB_URL: jdbc:mysql://db:3306/cheermanager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?define CORS_ALLOWED_ORIGINS}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
      CONSENTIMIENTOS_EXIGIR_SALUD: ${CONSENTIMIENTOS_EXIGIR_SALUD:-false}
      # --- Opcionales, SIN valor a proposito: si la variable esta en tu .env pasa al contenedor; si no esta, queda
      # sin definir y la aplicacion usa su valor por defecto. (No usar ${VAR:-}: una variable VACIA no es lo mismo
      # que una ausente; p. ej. SPRING_MAIL_HOST="" haria creer a la app que el SMTP esta configurado.)
      # Pagos de suscripcion (Wompi)
      WOMPI_PUBLIC_KEY:
      WOMPI_INTEGRITY_SECRET:
      WOMPI_EVENTS_SECRET:
      WOMPI_REDIRECT_URL:
      # Correo (SMTP)
      SPRING_MAIL_HOST:
      SPRING_MAIL_PORT:
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:
      MAIL_FROM:
      # WhatsApp Business Cloud API
      WHATSAPP_TOKEN:
      WHATSAPP_PHONE_NUMBER_ID:
      WHATSAPP_TEMPLATE:
      WHATSAPP_LANGUAGE:
      # Tareas automaticas
      FACTURACION_AUTOMATICA:
      RECORDATORIOS_AUTOMATICOS:
      # Bloqueo de cuenta y recuperacion de clave
      AUTH_MAX_LOGIN_ATTEMPTS:
      AUTH_LOCK_DURATION_MINUTES:
      AUTH_RESET_TOKEN_EXPIRATION_MINUTES:
      # Limite de intentos por IP (login / recuperar clave)
      RATE_LIMIT_ENABLED:
      RATE_LIMIT_LOGIN_MAX:
      RATE_LIMIT_LOGIN_VENTANA_SEG:
      RATE_LIMIT_FORGOT_MAX:
      RATE_LIMIT_FORGOT_VENTANA_SEG:
      RATE_LIMIT_RESET_MAX:
      RATE_LIMIT_RESET_VENTANA_SEG:
      # Logs y cabeceras de proxy
      LOG_LEVEL_ROOT:
      LOG_LEVEL_APP:
      FORWARD_HEADERS_STRATEGY:
      # UPLOAD_DIR no se pasa: lo fija el Dockerfile (/data/uploads) y coincide con el volumen de abajo.
    volumes:
      - uploads:/data/uploads   # fotos y documentos; sin esto se pierden al recrear el contenedor
    logging: *logs
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8081:8081"   # solo local: pon delante Caddy/Nginx con HTTPS

volumes:
  dbdata:
  uploads:
