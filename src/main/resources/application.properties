spring.application.name=cheermanager
server.port=${PORT:8081}

# =============================================================================
# CONFIGURACION POR ENTORNO
# Los secretos NO tienen valor por defecto: si falta una variable obligatoria la
# aplicacion no arranca (mejor eso que arrancar con credenciales conocidas).
# Para desarrollo local copia application-local.properties.example a
# application-local.properties (esta en .gitignore) y arranca con
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# =============================================================================

# --- Base de datos (obligatorias) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
# 'validate': Hibernate NO modifica el esquema; el esquema lo gestiona Flyway.
# Nunca uses 'update' fuera de tu maquina.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# --- Flyway (migraciones del esquema) ---
# V1 = esquema base, V2 = datos iniciales, V3 = alineacion con el modelo JPA (ver FASE4_LEEME.md).
# Una BD ya creada con los scripts 01 y 02 (sin historial de Flyway) se marca como version 2 y solo
# se aplica V3. Una BD vacia ejecuta V1, V2 y V3. NUNCA edites una migracion ya aplicada: crea V4, V5...
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=true
spring.jpa.show-sql=false
# (sin dialecto explicito: Hibernate 6 lo detecta; MySQL8Dialect esta deprecado)

# --- JWT (obligatorio; minimo 32 bytes. Genera uno con: openssl rand -base64 64) ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- Autenticacion ---
auth.max-login-attempts=${AUTH_MAX_LOGIN_ATTEMPTS:5}
auth.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:15}
auth.reset-password-token-expiration-minutes=${AUTH_RESET_TOKEN_EXPIRATION_MINUTES:15}
# URL del frontend para armar el enlace de recuperacion: <url>?token=XXXX
app.frontend.reset-password-url=${FRONTEND_RESET_URL:http://localhost:3000/reset-password}

# --- CORS: origenes permitidos separados por coma ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- SUPERADMIN de la plataforma (club "Plataforma", id 1). Los admins de cada club los crea el superadmin
# con POST /api/clubes. Solo se crea si no existe y si hay clave (minimo 10 caracteres).
app.bootstrap.admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:superadmin}
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# --- Consentimientos (Ley 1581 de 2012) ---
# true = no se puede registrar historial medico de una persona sin consentimiento DATOS_SALUD vigente.
# Dejalo en false mientras el club carga las autorizaciones (GET /api/consentimientos/pendientes) y
# activalo cuando ese reporte este en cero.
app.consentimientos.exigir-salud=${CONSENTIMIENTOS_EXIGIR_SALUD:false}

# --- Correo (opcional). Sin SMTP el enlace de recuperacion se escribe en el log del servidor ---
# spring.mail.host=smtp.ejemplo.com
# spring.mail.port=587
# spring.mail.username=...
# spring.mail.password=...
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@cheermanager.local}

# --- Proxy inverso: 'framework' si hay Nginx/Railway delante, para que la IP real
# (X-Forwarded-For) la resuelva Spring de forma segura en vez de confiar en el header a mano.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# --- Archivos ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.documents.upload-dir=${UPLOAD_DIR:./uploads}

# --- Errores HTTP ---
# GlobalExceptionHandler produce el campo "message" de forma controlada; aqui se
# apaga el de Spring para no filtrar trazas ni mensajes internos.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# --- Actuator: solo salud, sin detalles ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Logging ---
logging.level.root=INFO
logging.level.com.varcal.cheermanager=INFO

# --- Logs ---
# Cada linea lleva el id de la peticion ([rid]); el mismo id viaja en la cabecera X-Request-Id.
logging.pattern.level=%5p [%X{rid:-}]
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.varcal.cheermanager=${LOG_LEVEL_APP:INFO}
# Nunca subas a DEBUG org.springframework.security / org.hibernate.SQL en produccion: pueden filtrar datos personales.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
